version: '3.9'

networks:
  rg-network:
    driver: bridge

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    networks: [rg-network]
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    networks: [rg-network]
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9002:9001"   # WebSocket
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto-data:/mosquitto/data
    networks: [rg-network]

  api-gateway:
    build:
      context: ../rg-api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - SUPABASE_PROJECT_URL=${SUPABASE_PROJECT_URL}
      - WORKORDER_URL=http://workorder-service:8081
      - CMMS_URL=http://cmms-service:8082
      - HELPDESK_URL=http://helpdesk-service:8083
      - REPORTS_URL=http://report-engine:8084
    networks: [rg-network]
    depends_on:
      - workorder-service

  workorder-service:
    build:
      context: ../rg-workorder-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - NEON_URL=${NEON_URL}
      - REDIS_URL=redis://redis:6379
    networks: [rg-network]
    depends_on:
      redis:
        condition: service_healthy

  cmms-service:
    build:
      context: ../rg-cmms-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ASPNETCORE_URLS=http://+:8082
      - NEON_URL=${NEON_URL}
    networks: [rg-network]

  helpdesk-service:
    build:
      context: ../rg-helpdesk-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - NEON_URL=${NEON_URL}
      - REDIS_URL=redis://redis:6379/0
    networks: [rg-network]

  report-engine:
    build:
      context: ../rg-report-engine
      dockerfile: Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
      - NEON_URL=${NEON_URL}
    networks: [rg-network]

  iot-simulation:
    build:
      context: ../rg-iot-simulation
      dockerfile: Dockerfile
    environment:
      - MQTT_HOST=mosquitto
    networks: [rg-network]
    depends_on:
      - mosquitto

volumes:
  redis-data:
  minio-data:
  mosquitto-data:
