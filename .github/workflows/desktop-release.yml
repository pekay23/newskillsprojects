name: Desktop App Release

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'rg-desktop-windows/**'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rg-desktop-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rg-desktop-windows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup MSVC Build Tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundle
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate latest.json
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          }
          if (-not $installer) { throw "No installer found" }

          $sigFile = "$($installer.FullName).sig"
          $signature = (Get-Content $sigFile -Raw).Trim()
          $version = $env:GITHUB_REF_NAME -replace '^v', ''

          $latestJson = @{
            version = $version
            notes = "Raymond Gray IFM v$version"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/${{ github.repository }}/releases/latest/download/$($installer.Name)"
              }
            }
          } | ConvertTo-Json -Depth 10

          $latestJson | Set-Content "latest.json"
          Write-Host "Generated latest.json"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            rg-desktop-windows/src-tauri/target/release/bundle/msi/*.msi
            rg-desktop-windows/src-tauri/target/release/bundle/nsis/*.exe
            rg-desktop-windows/src-tauri/target/release/bundle/msi/*.msi.sig
            rg-desktop-windows/src-tauri/target/release/bundle/nsis/*.exe.sig
            rg-desktop-windows/latest.json

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: rg-desktop-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rg-desktop-windows/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Build Tauri bundle (Intel)
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri bundle (Apple Silicon)
        run: npm run tauri build -- --target aarch64-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            rg-desktop-windows/src-tauri/target/release/bundle/dmg/*.dmg
            rg-desktop-windows/src-tauri/target/release/bundle/macos/*.app
            rg-desktop-windows/src-tauri/target/release/bundle/dmg/*.dmg.sig
            rg-desktop-windows/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            rg-desktop-windows/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg.sig

  publish:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: macos

      - name: List downloaded files
        run: |
          find windows macos -type f 2>/dev/null || echo "No files found"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Raymond Gray IFM ${{ github.ref_name }}"
          body: "Release ${{ github.ref_name }} of the Raymond Gray IFM desktop app."
          files: |
            windows/**/*
            macos/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
